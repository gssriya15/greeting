<html>
    <head>
        <h2>greeting</h2>
    <body>
            <script>
                const hour = new Date().getHours()
                let message;
                if(hour > 5 && hour < 12){
                    document.write("GOOD MORNING");
                }
                else if(hour > 12 && hour < 17){
                    document.write("GOOD AFTERNOON");
                }
                else if(hour > 17 && hour < 21){
                    document.write("GOOD EVENING");
                }
                else{
                    document.write("GOOD NIGHT");
                }
            </script>
    </body>
    </head>
</html>
